<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>
:root{--bg-0:#04080f;--bg-1:#080f1c;--bg-2:#0c1528;--card:rgba(12,21,44,.85);--cyan:#00d4ff;--orange:#ff6b35;--purple:#a78bfa;--gold:#ffd700;--green:#22c55e;--text:#e6edf3;--muted:#8b949e;--dim:#3d4450;--border:rgba(0,212,255,.12);--g1:linear-gradient(135deg,#00d4ff,#0088bb);--g2:linear-gradient(135deg,#ff6b35,#cc3a00);--shadow:0 8px 40px rgba(0,0,0,.6);--glow:0 0 30px rgba(0,212,255,.18);--ease:all .32s cubic-bezier(.4,0,.2,1);--r:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Inter',sans-serif;background:var(--bg-0);color:var(--text);overflow-x:hidden;line-height:1.6}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-0)}::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}
img{display:block;max-width:100%}a{text-decoration:none;color:inherit}
/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:900;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;transition:var(--ease)}
.nav.solid{background:rgba(4,8,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 4px 30px rgba(0,0,0,.4)}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:1.55rem;font-weight:800;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.nav-links{list-style:none;display:flex;align-items:center;gap:1.4rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-size:.82rem;font-weight:500;color:var(--muted);transition:var(--ease);position:relative;white-space:nowrap}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:2px;background:var(--cyan);transform:scaleX(0);transition:var(--ease)}
.nav-links a:hover{color:var(--text)}.nav-links a:hover::after{transform:scaleX(1)}
.nav-cta{background:var(--g1)!important;color:#fff!important;padding:.45rem 1.2rem;border-radius:50px;font-weight:600!important}
.nav-cta::after{display:none!important}.nav-cta:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;border:none;background:none;padding:4px}
.burger span{display:block;width:24px;height:2px;background:var(--text);transition:var(--ease);border-radius:2px}
.mob-nav{position:fixed;top:70px;inset:auto 0 0 0;height:calc(100vh - 70px);background:rgba(4,8,15,.98);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform .35s ease;z-index:899;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2rem}
.mob-nav.open{transform:translateX(0)}.mob-nav a{font-size:1.6rem;font-weight:700;color:var(--muted);transition:var(--ease)}.mob-nav a:hover{color:var(--cyan)}
/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 70% 40%,rgba(0,212,255,.06) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 20% 80%,rgba(255,107,53,.05) 0%,transparent 60%),var(--bg-0)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.035) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none}
.orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,212,255,.12),transparent 70%);top:-200px;right:-150px;animation:drift 10s ease-in-out infinite}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,107,53,.1),transparent 70%);bottom:-100px;left:-100px;animation:drift 13s 4s ease-in-out infinite reverse}
.orb-3{width:350px;height:350px;background:radial-gradient(circle,rgba(167,139,250,.09),transparent 70%);top:45%;left:38%;animation:drift 9s 2s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,-35px) scale(1.06)}}
.hero-wrap{max-width:1280px;margin:0 auto;padding:70px 3rem 0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;min-height:100vh}
.hero-left{z-index:1}.badge-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);padding:.35rem 1rem;border-radius:50px;font-size:.78rem;font-weight:500;color:var(--cyan);margin-bottom:1.6rem}
.badge-dot{width:7px;height:7px;background:var(--cyan);border-radius:50%;animation:blink 1.5s ease infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.hero-name{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.4rem,4.5vw,4rem);font-weight:800;line-height:1.08;letter-spacing:-2px;margin-bottom:.75rem}
.hero-name span{background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-role{font-size:1.3rem;color:var(--muted);min-height:2rem;font-weight:400;margin-bottom:1.3rem}
.typed-cursor{color:var(--cyan);animation:blink 1s infinite}
.hero-desc{color:var(--muted);font-size:.97rem;line-height:1.85;max-width:490px;margin-bottom:2.2rem}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2.5rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.9rem;border-radius:50px;font-weight:600;font-size:.92rem;cursor:pointer;transition:var(--ease);border:none;font-family:inherit}
.btn-primary{background:var(--g1);color:#fff;box-shadow:0 4px 22px rgba(0,212,255,.28)}.btn-primary:hover{transform:translateY(-3px);box-shadow:0 8px 35px rgba(0,212,255,.45)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-3px)}
.hero-socials{display:flex;gap:.85rem}
.soc{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);transition:var(--ease)}
.soc:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.07);transform:translateY(-3px)}
.hero-right{z-index:1;display:flex;justify-content:center;align-items:center;position:relative}
.avatar-wrap{position:relative;width:340px;height:340px}
.avatar-ring{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--cyan) 0deg,var(--orange) 120deg,var(--purple) 240deg,var(--cyan) 360deg);animation:spin 8s linear infinite;padding:3px}
.avatar-ring::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg-0)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;z-index:1}
.float-chip{position:absolute;background:rgba(12,21,44,.92);border:1px solid var(--border);border-radius:12px;padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;backdrop-filter:blur(16px);font-size:.82rem;font-weight:600;box-shadow:var(--shadow);z-index:2;white-space:nowrap}
.chip-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.chip-label{font-size:.7rem;color:var(--muted);margin-bottom:.1rem}
.chip-1{bottom:10px;left:-65px;animation:chipFloat 4s ease-in-out infinite}
.chip-2{top:15px;right:-55px;animation:chipFloat 4s 2s ease-in-out infinite}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.scroll-cue{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--dim);font-size:.72rem;cursor:pointer;transition:var(--ease)}
.scroll-cue:hover{color:var(--cyan)}.scroll-mouse{width:24px;height:38px;border:2px solid currentColor;border-radius:12px;display:flex;justify-content:center;padding-top:5px}
.scroll-wheel{width:3px;height:7px;background:var(--cyan);border-radius:2px;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}
/* STATS */
.stats-bar{background:var(--bg-1);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:2.5rem 3rem}
.stats-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;text-align:center}
.stat-col{position:relative}.stat-col::after{content:'';position:absolute;right:0;top:15%;height:70%;width:1px;background:var(--border)}.stat-col:last-child::after{display:none}
.stat-n{font-family:'Space Grotesk',sans-serif;font-size:2.6rem;font-weight:800;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;display:block}
.stat-l{font-size:.8rem;color:var(--muted);margin-top:.3rem;text-transform:uppercase;letter-spacing:.5px}
/* SECTIONS */
section{padding:7rem 3rem}.wrap{max-width:1280px;margin:0 auto}
.sec-head{text-align:center;margin-bottom:4rem}.sec-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--cyan);background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.18);padding:.28rem 1rem;border-radius:50px;margin-bottom:1rem;letter-spacing:1.5px}
.sec-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(2rem,3.5vw,2.9rem);font-weight:800;letter-spacing:-1.5px;margin-bottom:.9rem}
.sec-title em{font-style:normal;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec-bar{width:50px;height:4px;background:var(--g1);border-radius:2px;margin:.6rem auto 1rem}.sec-sub{color:var(--muted);font-size:.95rem;max-width:480px;margin:0 auto}
/* ABOUT */
.about-bg{background:var(--bg-1)}.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:5rem;align-items:center}
.about-frame{border-radius:var(--r);overflow:hidden;position:relative}.about-frame img{width:100%;height:460px;object-fit:cover;object-position:center}
.about-frame::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,.15),transparent 55%);pointer-events:none}
.about-fc{position:absolute;background:rgba(8,15,28,.9);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.3rem;backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.fc-n{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:800;color:var(--cyan);line-height:1}.fc-l{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.fc-a{bottom:-18px;left:-18px}.fc-b{top:-18px;right:-18px}
.about-text h3{font-family:'Space Grotesk',sans-serif;font-size:1.75rem;font-weight:700;letter-spacing:-.5px;margin-bottom:1.2rem;line-height:1.25}
.about-text h3 strong{color:var(--cyan);font-weight:700}.about-text p{color:var(--muted);line-height:1.85;margin-bottom:1.1rem;font-size:.96rem}
.about-meta{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.5rem;margin-top:1.8rem;padding-top:1.8rem;border-top:1px solid var(--border)}
.meta-item span{display:block}.meta-k{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:.2rem}.meta-v{font-size:.88rem;font-weight:600;color:var(--text)}.meta-v.avail{color:var(--green)}
/* SKILLS */
.skills-bg{background:var(--bg-0)}.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem}
.skill-group-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:2rem;display:flex;align-items:center;gap:.75rem}
.skill-group-title::before{content:'';display:block;width:20px;height:2px;background:var(--cyan)}
.sk{margin-bottom:1.6rem}.sk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.sk-name{font-size:.88rem;font-weight:500}
.sk-pct{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--cyan);font-weight:600}.sk-pct.two{color:var(--orange)}
.sk-track{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}.sk-fill{height:100%;background:var(--g1);border-radius:3px;width:0;transition:width 1.3s cubic-bezier(.4,0,.2,1)}.sk-fill.two{background:var(--g2)}
.tools-wrap{margin-top:3.5rem}.tools-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.65rem}.chip{display:flex;align-items:center;gap:.5rem;padding:.45rem .95rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:50px;font-size:.82rem;font-weight:500;transition:var(--ease);cursor:default}
.chip:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.05)}
/* PROJECTS */
.projects-bg{background:var(--bg-1)}.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:var(--ease);backdrop-filter:blur(10px)}
.proj-card:hover{transform:translateY(-9px);border-color:var(--cyan);box-shadow:0 24px 70px rgba(0,0,0,.5),var(--glow)}
.proj-img{position:relative;height:215px;overflow:hidden}.proj-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}.proj-card:hover .proj-img img{transform:scale(1.08)}
.proj-img-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(4,8,15,.88) 100%)}
.proj-num{position:absolute;top:.9rem;right:.9rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--cyan);background:rgba(4,8,15,.85);border:1px solid rgba(0,212,255,.3);padding:.22rem .65rem;border-radius:50px;backdrop-filter:blur(8px)}
.proj-hover-ov{position:absolute;inset:0;background:rgba(4,8,15,.88);display:flex;align-items:center;justify-content:center;gap:.85rem;opacity:0;transition:var(--ease)}.proj-card:hover .proj-hover-ov{opacity:1}
.ov-btn{display:flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:50px;font-size:.82rem;font-weight:600;transition:var(--ease);border:1px solid}
.ov-btn-p{background:var(--g1);color:#fff;border-color:transparent}.ov-btn-s{background:transparent;color:var(--text);border-color:var(--border)}.ov-btn:hover{transform:scale(1.05)}
.proj-body{padding:1.4rem}.proj-tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.7rem}
.tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:.18rem .6rem;border-radius:50px}
.tag-c{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.tag-o{background:rgba(255,107,53,.1);color:var(--orange);border:1px solid rgba(255,107,53,.2)}
.tag-p{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.proj-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;line-height:1.35;margin-bottom:.7rem;letter-spacing:-.2px}
.proj-desc{color:var(--muted);font-size:.85rem;line-height:1.72;margin-bottom:1.1rem}
.proj-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.9rem;border-top:1px solid var(--border)}
.proj-links{display:flex;gap:.7rem}.proj-lnk{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.8rem;font-weight:500;transition:var(--ease)}.proj-lnk:hover{color:var(--cyan)}
.proj-date{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--dim)}
/* TIMELINE (shared: education + volunteer) */
.edu-bg{background:var(--bg-0)}.vol-bg{background:var(--bg-1)}
.tl{position:relative;max-width:820px;margin:0 auto;padding-left:2rem}
.tl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--cyan),var(--orange),var(--purple),var(--green))}
.tl-item{position:relative;padding:0 0 2.8rem 2.5rem}
.tl-dot{position:absolute;left:-7px;top:0;width:16px;height:16px;border-radius:50%;border:3px solid var(--bg-0);flex-shrink:0}
.tl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem 1.75rem;backdrop-filter:blur(10px);transition:var(--ease)}.tl-card:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.tl-date{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--cyan);margin-bottom:.45rem}
.tl-role{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:.2rem}.tl-org{font-size:.88rem;color:var(--muted);margin-bottom:.7rem}.tl-info{font-size:.84rem;color:var(--dim);line-height:1.65}
/* CERTS */
.certs-bg{background:var(--bg-1)}.certs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.cert-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem 1.5rem;display:flex;gap:1rem;align-items:flex-start;transition:var(--ease);backdrop-filter:blur(10px)}
.cert-card:hover{border-color:var(--cyan);transform:translateY(-5px);box-shadow:var(--glow)}
.cert-ico{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.cert-info h4{font-size:.9rem;font-weight:700;line-height:1.3;margin-bottom:.3rem}.cert-info p{font-size:.77rem;color:var(--muted);margin-bottom:.5rem}
.cert-badge{display:inline-block;font-size:.68rem;font-weight:700;padding:.18rem .6rem;border-radius:50px}
/* HONOURS */
.hon-bg{background:var(--bg-0)}.awards-list{display:flex;flex-direction:column;gap:.95rem;max-width:880px;margin:0 auto}
.aw-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.4rem;display:flex;align-items:center;gap:1.1rem;transition:var(--ease);backdrop-filter:blur(10px);flex-wrap:wrap}
.aw-item:hover{border-color:var(--gold);transform:translateX(7px);box-shadow:0 0 22px rgba(255,215,0,.08)}
.aw-ico{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem}
.aw-text{flex:1;min-width:0}.aw-text h4{font-size:.9rem;font-weight:700;margin-bottom:.2rem}.aw-text p{font-size:.78rem;color:var(--muted)}
.aw-year{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--gold);background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.2);padding:.2rem .6rem;border-radius:50px;white-space:nowrap;flex-shrink:0}
.aw-badge{font-size:.68rem;font-weight:700;padding:.18rem .6rem;border-radius:50px;white-space:nowrap;flex-shrink:0}
/* PUBLICATIONS */
.pub-bg{background:var(--bg-1)}.pub-list{display:flex;flex-direction:column;gap:1.4rem}
.pub-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.6rem;transition:var(--ease);backdrop-filter:blur(10px)}.pub-item:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.pub-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap}
.pub-type{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:.2rem .65rem;border-radius:50px}
.pt-journal{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.pt-conf{background:rgba(255,107,53,.1);color:var(--orange);border:1px solid rgba(255,107,53,.2)}
.pt-tech{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.pub-year{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted)}
.pub-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;line-height:1.4;margin-bottom:.45rem}.pub-authors{font-size:.82rem;color:var(--muted);margin-bottom:.45rem}
.pub-venue{font-size:.82rem;color:var(--purple);font-style:italic;margin-bottom:.9rem}
.pub-foot{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.pub-lnk{display:flex;align-items:center;gap:.38rem;font-size:.8rem;font-weight:500;color:var(--muted);transition:var(--ease)}.pub-lnk:hover{color:var(--cyan)}
.pub-status{font-size:.68rem;font-weight:700;padding:.18rem .6rem;border-radius:50px}
.ps-published{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.ps-accepted{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.ps-submitted{background:rgba(255,215,0,.08);color:var(--gold);border:1px solid rgba(255,215,0,.2)}
/* PATENTS */
.pat-bg{background:var(--bg-0)}.pat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;max-width:960px;margin:0 auto}
.pat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.9rem;transition:var(--ease);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.pat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}.pat-c::before{background:var(--g1)}.pat-o::before{background:var(--g2)}
.pat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.pat-pill{display:inline-flex;align-items:center;gap:.38rem;font-size:.7rem;font-weight:700;padding:.22rem .7rem;border-radius:50px;margin-bottom:1rem;background:rgba(255,215,0,.08);color:var(--gold);border:1px solid rgba(255,215,0,.22)}
.pat-num{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--dim);margin-bottom:.6rem}
.pat-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;line-height:1.4;margin-bottom:.55rem}.pat-desc{font-size:.84rem;color:var(--muted);line-height:1.65;margin-bottom:1rem}
.pat-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;padding-top:.9rem;border-top:1px solid var(--border)}
.pat-date{font-size:.76rem;color:var(--dim);font-family:'JetBrains Mono',monospace}.pat-tag{font-size:.68rem;font-weight:600;padding:.18rem .58rem;border-radius:50px;background:rgba(0,212,255,.07);color:var(--cyan);border:1px solid rgba(0,212,255,.16)}
/* SERVICES */
.svc-bg{background:var(--bg-0)}.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.svc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.65rem;transition:var(--ease);backdrop-filter:blur(10px)}
.svc-card:hover{border-color:var(--cyan);transform:translateY(-5px);box-shadow:var(--glow)}
.svc-ico{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:1.1rem}
.svc-title{font-family:'Space Grotesk',sans-serif;font-size:.98rem;font-weight:700;margin-bottom:.45rem}.svc-desc{font-size:.84rem;color:var(--muted);line-height:1.7}
.svc-meta{margin-top:.85rem;font-size:.76rem;color:var(--dim);display:flex;align-items:center;gap:.4rem}
/* CAREER BREAK */
.brk-bg{background:var(--bg-1)}.brk-wrap{max-width:800px;margin:0 auto}
.brk-card{background:var(--card);border:1px solid rgba(255,215,0,.2);border-radius:var(--r);padding:2.6rem;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.brk-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--orange),var(--purple))}
.brk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.brk-ttl h3{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:-.4px;margin-bottom:.3rem}.brk-ttl p{font-size:.87rem;color:var(--muted)}
.brk-badge{display:flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:700;padding:.35rem .95rem;border-radius:50px;background:rgba(255,215,0,.07);color:var(--gold);border:1px solid rgba(255,215,0,.22);white-space:nowrap;flex-shrink:0;height:fit-content}
.brk-body p{color:var(--muted);font-size:.93rem;line-height:1.85;margin-bottom:1rem}
.brk-bullets{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-top:.2rem}
.brk-bullets li{display:flex;align-items:flex-start;gap:.6rem;font-size:.88rem;color:var(--muted)}
.brk-bullets li i{color:var(--gold);margin-top:.18rem;flex-shrink:0;font-size:.75rem}
.brk-outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.8rem;padding-top:1.8rem;border-top:1px solid var(--border)}
.brk-out{text-align:center}.brk-out-n{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;font-weight:800;color:var(--gold);display:block;line-height:1}.brk-out-l{font-size:.76rem;color:var(--muted);margin-top:.3rem}
/* CONTACT */
.contact-bg{background:var(--bg-0)}.contact-grid{display:grid;grid-template-columns:1fr 1.55fr;gap:4.5rem;align-items:start}
.contact-left h3{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;font-weight:700;letter-spacing:-.5px;margin-bottom:1rem;line-height:1.25}.contact-left p{color:var(--muted);line-height:1.85;margin-bottom:2rem;font-size:.95rem}
.contact-list{display:flex;flex-direction:column;gap:.85rem}
.c-item{display:flex;align-items:center;gap:1rem;padding:.95rem 1.2rem;background:var(--card);border:1px solid var(--border);border-radius:12px;transition:var(--ease)}.c-item:hover{border-color:var(--cyan);transform:translateX(7px)}
.c-ico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.95rem}
.c-text .c-lbl{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:.15rem}.c-text .c-val{font-size:.88rem;font-weight:500}
.c-arrow{margin-left:auto;color:var(--dim);font-size:.78rem;transition:var(--ease)}.c-item:hover .c-arrow{color:var(--cyan)}
.form-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2.4rem;backdrop-filter:blur(10px)}
.form-box h3{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:1.75rem}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.fg{margin-bottom:1.4rem}
.fg label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:.45rem}
.fg input,.fg textarea{width:100%;padding:.8rem 1.1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:.88rem;transition:var(--ease);outline:none;resize:none}
.fg input:focus,.fg textarea:focus{border-color:var(--cyan);background:rgba(0,212,255,.025);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--dim)}.fg textarea{min-height:125px}
/* FOOTER */
footer{background:var(--bg-1);border-top:1px solid var(--border);padding:2rem 3rem}
.foot-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.foot-logo{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:800;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.foot-copy{font-size:.82rem;color:var(--dim)}.foot-lnks{display:flex;gap:1.5rem}
.foot-lnks a{font-size:.82rem;color:var(--dim);transition:var(--ease)}.foot-lnks a:hover{color:var(--cyan)}
/* ANIMATIONS */
.rv{opacity:0;transform:translateY(36px);transition:opacity .7s ease,transform .7s ease}
.rv-l{opacity:0;transform:translateX(-36px);transition:opacity .75s ease,transform .75s ease}
.rv-r{opacity:0;transform:translateX(36px);transition:opacity .75s ease,transform .75s ease}
.rv.in,.rv-l.in,.rv-r.in{opacity:1;transform:translate(0)}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}
.btt{position:fixed;bottom:2rem;right:2rem;width:46px;height:46px;background:var(--g1);border:none;border-radius:50%;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--ease);opacity:0;pointer-events:none;box-shadow:0 4px 22px rgba(0,212,255,.4);z-index:800}
.btt.show{opacity:1;pointer-events:auto}.btt:hover{transform:translateY(-4px) scale(1.1)}
/* RESPONSIVE */
/* EXTERNAL LINK PILLS */
.ext-links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.85rem}
.ext-pill{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .9rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:50px;font-size:.78rem;font-weight:500;color:var(--muted);transition:var(--ease)}
.ext-pill:hover{border-color:var(--cyan);color:var(--text);background:rgba(0,212,255,.06);transform:translateY(-2px)}
.ext-pill i{font-size:.8rem}
@media(max-width:1024px){.projects-grid{grid-template-columns:1fr 1fr}.certs-grid{grid-template-columns:1fr 1fr}.svc-grid{grid-template-columns:1fr 1fr}}
@media(max-width:768px){
  .nav{padding:0 1.5rem}.nav-links{display:none}.burger{display:flex}
  section{padding:5rem 1.5rem}.stats-bar{padding:2rem 1.5rem}
  .hero-wrap{grid-template-columns:1fr;padding:70px 1.5rem 3rem;text-align:center;min-height:auto;padding-top:110px}
  .hero-right{display:none}.hero-btns,.hero-socials{justify-content:center}.hero-desc{margin:0 auto 2rem}
  .about-grid{grid-template-columns:1fr}.about-img-side{display:none}
  .skills-grid{grid-template-columns:1fr}.projects-grid{grid-template-columns:1fr}
  .certs-grid{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}
  .stats-inner{grid-template-columns:repeat(2,1fr)}.f-row{grid-template-columns:1fr}
  .pat-grid{grid-template-columns:1fr}.svc-grid{grid-template-columns:1fr}.brk-outcomes{grid-template-columns:1fr 1fr}
  .foot-inner{flex-direction:column;text-align:center}
}
@media(max-width:480px){.stats-inner{grid-template-columns:1fr 1fr}.brk-outcomes{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <nav class="nav" id="nav">
    <span class="nav-logo" id="nav-logo">AM.</span>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="burger" id="burger"><span></span><span></span><span></span></button>
  </nav>
</header>
<nav class="mob-nav" id="mobNav"></nav>

<main id="main"></main>

<button class="btt" id="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <i class="fas fa-arrow-up"></i>
</button>

<script>
/* ── colour helpers ─────────────────────────────────────── */
const C={
  cyan:  ['rgba(0,212,255,.1)','var(--cyan)','rgba(0,212,255,.2)'],
  orange:['rgba(255,107,53,.1)','var(--orange)','rgba(255,107,53,.2)'],
  purple:['rgba(167,139,250,.1)','var(--purple)','rgba(167,139,250,.2)'],
  gold:  ['rgba(255,215,0,.08)','var(--gold)','rgba(255,215,0,.2)'],
  green: ['rgba(34,197,94,.1)','var(--green)','rgba(34,197,94,.2)'],
};
const Cd=(c)=>C[c]||C.cyan;
const cIco=(c)=>`background:${Cd(c)[0]};color:${Cd(c)[1]}`;
const cBadge=(c)=>`background:${Cd(c)[0]};color:${Cd(c)[1]};border:1px solid ${Cd(c)[2]}`;
const DOT={
  cyan:'background:var(--cyan);box-shadow:0 0 14px rgba(0,212,255,.5)',
  orange:'background:var(--orange);box-shadow:0 0 14px rgba(255,107,53,.5)',
  purple:'background:var(--purple);box-shadow:0 0 14px rgba(167,139,250,.5)',
  gold:'background:var(--gold);box-shadow:0 0 14px rgba(255,215,0,.5)',
  green:'background:var(--green);box-shadow:0 0 14px rgba(34,197,94,.5)',
};
const TAG={cyan:'tag-c',orange:'tag-o',purple:'tag-p'};
const PUB_TYPE={journal:'pt-journal',conference:'pt-conf',tech:'pt-tech'};
const PUB_LABEL={journal:'Journal Article',conference:'Conference Paper',tech:'Technical Paper'};
const PUB_STATUS={published:'ps-published',accepted:'ps-accepted',submitted:'ps-submitted'};
const PUB_SLABEL={published:'Published',accepted:'Accepted',submitted:'Under Review'};
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function detectLinkMeta(url){
  const u=(url||'').toLowerCase();
  if(u.includes('youtu'))        return{icon:'fab fa-youtube',      color:'#ff0000'};
  if(u.includes('drive.google')) return{icon:'fab fa-google-drive', color:'#4285f4'};
  if(u.includes('docs.google'))  return{icon:'fas fa-file-alt',     color:'#4285f4'};
  if(u.includes('github.com'))   return{icon:'fab fa-github',       color:'var(--text)'};
  if(u.includes('figma.com'))    return{icon:'fab fa-figma',        color:'#f24e1e'};
  if(u.includes('notion.so'))    return{icon:'fas fa-book',         color:'var(--text)'};
  if(u.includes('vimeo.com'))    return{icon:'fab fa-vimeo',        color:'#1ab7ea'};
  if(u.includes('dropbox.com'))  return{icon:'fab fa-dropbox',      color:'#0061ff'};
  if(u.includes('onedrive.')||u.includes('sharepoint.')) return{icon:'fas fa-cloud',color:'#0078d4'};
  if(u.endsWith('.pdf')||u.includes('/pdf')) return{icon:'fas fa-file-pdf',color:'var(--red)'};
  return{icon:'fas fa-external-link-alt', color:'var(--muted)'};
}
function fileViewBtn(url, label) {
  if (!url) return '';
  const isPdf = url.toLowerCase().includes('.pdf');
  const icon = isPdf ? 'fas fa-file-pdf' : 'fas fa-image';
  const color = isPdf ? 'var(--red)' : 'var(--cyan)';
  return `<a href="${esc(url)}" target="_blank" rel="noopener" class="ext-pill"><i class="${icon}" style="color:${color}"></i>${esc(label)}</a>`;
}
function renderExtLinks(links){
  if(!links?.length)return'';
  const pills=links.filter(l=>l.url).map(l=>{
    const m=detectLinkMeta(l.url);
    return`<a href="${esc(l.url)}" target="_blank" rel="noopener" class="ext-pill"><i class="${m.icon}" style="color:${m.color}"></i>${esc(l.label||'View Link')}</a>`;
  }).join('');
  return pills?`<div class="ext-links">${pills}</div>`:'';
}
function secHead(tag,title,em,sub){
  return `<div class="sec-head rv"><span class="sec-tag">${tag}</span>
  <h2 class="sec-title">${esc(title)} <em>${esc(em)}</em></h2>
  <div class="sec-bar"></div>${sub?`<p class="sec-sub">${esc(sub)}</p>`:''}</div>`;
}

/* ── url helper ─────────────────────────────────────────── */
function extUrl(url,display){
  const clean=s=>(s||'').trim();
  const fix=s=>/^https?:\/\//i.test(s)?s:'https://'+s;
  if(clean(url)) return fix(clean(url));
  if(clean(display)&&clean(display).includes('.')) return fix(clean(display));
  return null;
}
const xlink=(href,cls,attrs,inner)=>
  href?`<a href="${esc(href)}" class="${cls}" ${attrs} target="_blank" rel="noopener noreferrer">${inner}</a>`
     :`<a href="#" class="${cls}" style="pointer-events:none;opacity:.35">${inner}</a>`;

/* ── section renderers ──────────────────────────────────── */
function rHero(d){
  const p=d.profile,c=d.contact;
  const liUrl=extUrl(c.linkedin_url,c.linkedin);
  const ghUrl=extUrl(c.github_url,c.github);
  const chips=(p.chips||[]).map((ch,i)=>`
    <div class="float-chip chip-${i+1}">
      <div class="chip-icon" style="${cIco(ch.color)}"><i class="${esc(ch.icon)}"></i></div>
      <div><div class="chip-label">${esc(ch.label)}</div>${esc(ch.value)}</div>
    </div>`).join('');
  return `<section class="hero" id="home">
    <div class="hero-grid"></div>
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    <div class="hero-wrap">
      <div class="hero-left">
        <div class="badge-pill">${p.availability_dot?'<span class="badge-dot"></span>':''}${esc(p.availability)}</div>
        <h1 class="hero-name">Hi, I'm <span>${esc(p.name)}</span></h1>
        <div class="hero-role"><span id="typed"></span><span class="typed-cursor">|</span></div>
        <p class="hero-desc">${esc(p.tagline)}</p>
        <div class="hero-btns">
          <a href="#projects" class="btn btn-primary"><i class="fas fa-briefcase"></i> View Projects</a>
          ${c.cv_url?`<a href="${esc(c.cv_url)}" class="btn btn-outline" target="_blank" rel="noopener noreferrer"><i class="fas fa-download"></i> Download CV</a>`:''}
        </div>
        <div class="hero-socials">
          ${xlink(ghUrl,'soc','title="GitHub"','<i class="fab fa-github"></i>')}
          ${xlink(liUrl,'soc','title="LinkedIn"','<i class="fab fa-linkedin-in"></i>')}
          ${c.email?`<a href="mailto:${esc(c.email)}" class="soc" title="Email"><i class="fas fa-envelope"></i></a>`:''}
        </div>
      </div>
      <div class="hero-right">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <img src="${esc(p.photo)}" alt="${esc(p.name)}" class="avatar-img">
        </div>${chips}
      </div>
    </div>
    <div class="scroll-cue" onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">
      <div class="scroll-mouse"><div class="scroll-wheel"></div></div><span>Scroll</span>
    </div>
  </section>`;
}

function rStats(d){
  const cols=(d.stats||[]).map(s=>
    `<div class="stat-col rv"><span class="stat-n" data-n="${s.value}" data-dec="${s.decimals||0}">0</span>
    <div class="stat-l">${esc(s.label)}</div></div>`).join('');
  return `<div class="stats-bar"><div class="stats-inner">${cols}</div></div>`;
}

function rAbout(d){
  const p=d.profile,ab=p.about,det=ab.details||{};
  const img=`<div style="position:relative">
    <div class="about-frame"><img src="https://picsum.photos/seed/${esc(d.meta?.slug||'about')}-ws/600/460" alt="workspace"></div>
    <div class="about-fc fc-a"><div class="fc-n">${esc(det.cgpa||'')}</div><div class="fc-l">CGPA</div></div>
    <div class="about-fc fc-b"><div class="fc-n">${(d.projects||[]).length}+</div><div class="fc-l">Projects</div></div>
  </div>`;
  const paras=(ab.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('');
  const metas=[
    ['Degree',det.degree],['University',det.university],
    ['Graduation',det.graduation],['Location',det.location],
    ['Specialisation',det.specialization],['Status',det.status],
  ].map(([k,v])=>`<div class="meta-item"><span class="meta-k">${k}</span>
    <span class="meta-v${k==='Status'?' avail':''}">${esc(v||'')}</span></div>`).join('');
  return `<section class="about-bg" id="about"><div class="wrap">
    ${secHead('// WHO I AM','About','Me','Engineering tomorrow\'s solutions with precision and purpose')}
    <div class="about-grid">
      <div class="rv-l">${img}</div>
      <div class="about-text rv-r">
        <h3>${esc(ab.title||'About Me')}<strong>${esc(ab.highlight||'')}</strong></h3>
        ${paras}
        <div class="about-meta">${metas}</div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem">
          <a href="#projects" class="btn btn-primary"><i class="fas fa-eye"></i> View Work</a>
          <a href="#contact"  class="btn btn-outline"><i class="fas fa-paper-plane"></i> Get In Touch</a>
        </div>
      </div>
    </div>
  </div></section>`;
}

function rSkills(d){
  const sk=d.skills||{};
  if(!(sk.core||[]).length&&!(sk.computational||[]).length&&!(sk.tools||[]).length&&!(sk.soft||[]).length) return '';
  const bar=(s,i,two)=>`<div class="sk rv d${Math.min(i+1,4)}">
    <div class="sk-row"><span class="sk-name">${esc(s.name)}</span>
    <span class="sk-pct${two?' two':''}">${s.percent}%</span></div>
    <div class="sk-track"><div class="sk-fill${two?' two':''}" data-w="${s.percent}"></div></div></div>`;
  const cores=(sk.core||[]).map((s,i)=>bar(s,i,false)).join('');
  const comps=(sk.computational||[]).map((s,i)=>bar(s,i,true)).join('');
  const tools=(sk.tools||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const softs=(sk.soft||[]).map(s=>`<span class="chip" style="border-color:rgba(167,139,250,.3);color:var(--purple)"><i class="fas fa-check" style="font-size:.65rem"></i> ${esc(s)}</span>`).join('');
  return `<section class="skills-bg" id="skills"><div class="wrap">
    ${secHead('// EXPERTISE','Technical','Skills','A toolkit honed through coursework, projects, and competition')}
    ${(cores||comps)?`<div class="skills-grid">
      ${cores?`<div class="rv-l"><div class="skill-group-title">Engineering Core</div>${cores}</div>`:''}
      ${comps?`<div class="rv-r"><div class="skill-group-title">Computational & Programming</div>${comps}</div>`:''}
    </div>`:''}
    ${tools?`<div class="tools-wrap rv"><div class="tools-label">Software & Tools</div>
    <div class="chips">${tools}</div></div>`:''}
    ${softs?`<div class="tools-wrap rv" style="margin-top:2rem"><div class="tools-label">Soft Skills</div>
    <div class="chips">${softs}</div></div>`:''}
  </div></section>`;
}

function rProjects(d){
  if(!(d.projects||[]).length) return '';

/* ── theme ──────────────────────────────────────────────── */
function applyTheme(t){
  const root=document.documentElement;
  const P={
    cyan:  ['#00d4ff','linear-gradient(135deg,#00d4ff,#0088bb)','rgba(0,212,255,.12)','0 0 30px rgba(0,212,255,.18)'],
    orange:['#ff6b35','linear-gradient(135deg,#ff8c42,#cc3a00)','rgba(255,107,53,.12)','0 0 30px rgba(255,107,53,.18)'],
    purple:['#a78bfa','linear-gradient(135deg,#a78bfa,#7c3aed)','rgba(167,139,250,.12)','0 0 30px rgba(167,139,250,.18)'],
    green: ['#22c55e','linear-gradient(135deg,#22c55e,#15803d)','rgba(34,197,94,.12)','0 0 30px rgba(34,197,94,.18)'],
    gold:  ['#ffd700','linear-gradient(135deg,#ffd700,#b8860b)','rgba(255,215,0,.12)','0 0 30px rgba(255,215,0,.18)'],
    pink:  ['#ec4899','linear-gradient(135deg,#ec4899,#9d174d)','rgba(236,72,153,.12)','0 0 30px rgba(236,72,153,.18)'],
  };
  const pr=P[t?.preset]||P.cyan;
  root.style.setProperty('--cyan',pr[0]);
  root.style.setProperty('--g1',pr[1]);
  root.style.setProperty('--border',pr[2]);
  root.style.setProperty('--glow',pr[3]);
  if(t?.bg_image){
    const ov=t.bg_overlay!=null?Number(t.bg_overlay):0.9;
    root.style.setProperty('--bg-0',`rgba(4,8,15,${ov})`);
    root.style.setProperty('--bg-1',`rgba(8,15,28,${ov})`);
    root.style.setProperty('--bg-2',`rgba(12,21,44,${ov})`);
    document.body.style.backgroundImage=`url(${JSON.stringify(t.bg_image)})`;
    document.body.style.backgroundSize='cover';
    document.body.style.backgroundPosition='center';
    document.body.style.backgroundAttachment='fixed';
  }
}

/* ── animations & interactivity ─────────────────────────── */
function initAll(d){
  /* nav scroll */
  const nav=document.getElementById('nav'),btt=document.getElementById('btt');
  const navAs=()=>document.querySelectorAll('.nav-links a');
  const secs=()=>document.querySelectorAll('section[id]');
  window.addEventListener('scroll',()=>{
    nav.classList.toggle('solid',window.scrollY>40);
    btt.classList.toggle('show',window.scrollY>300);
    let cur='';secs().forEach(s=>{if(window.scrollY>=s.offsetTop-90)cur=s.id;});
    navAs().forEach(a=>{a.style.color=a.getAttribute('href')==='#'+cur?'var(--cyan)':'';});
  });

  /* burger */
  const burger=document.getElementById('burger'),mob=document.getElementById('mobNav');
  burger.addEventListener('click',()=>mob.classList.toggle('open'));
  mob.querySelectorAll('.mob-link').forEach(a=>a.addEventListener('click',()=>mob.classList.remove('open')));

  /* typing */
  const typedEl=document.getElementById('typed');
  if(typedEl){
    const roles=d.profile?.roles||['Student'];
    let ri=0,ci=0,del=false;
    (function tick(){
      const cur=roles[ri];
      typedEl.textContent=del?cur.slice(0,--ci):cur.slice(0,++ci);
      let w=del?55:95;
      if(!del&&ci===cur.length){w=2100;del=true;}
      else if(del&&ci===0){del=false;ri=(ri+1)%roles.length;w=450;}
      setTimeout(tick,w);
    })();
  }

  /* scroll reveal + skill bars */
  const ro=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.classList.add('in');
      e.target.querySelectorAll('.sk-fill').forEach(f=>{
        setTimeout(()=>f.style.width=f.dataset.w+'%',250);
      });
    });
  },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.rv,.rv-l,.rv-r').forEach(el=>ro.observe(el));

  /* skill bars fallback when skills section enters view */
  const skillSec=document.getElementById('skills');
  if(skillSec){
    new IntersectionObserver(en=>{
      if(!en[0].isIntersecting)return;
      document.querySelectorAll('.sk-fill').forEach(f=>f.style.width=f.dataset.w+'%');
    },{threshold:0.25}).observe(skillSec);
  }

  /* stat counters */
  const sb=document.querySelector('.stats-bar');
  if(sb){
    new IntersectionObserver(en=>{
      if(!en[0].isIntersecting)return;
      document.querySelectorAll('.stat-n[data-n]').forEach(el=>{
        const target=parseFloat(el.dataset.n),dec=parseInt(el.dataset.dec||0);
        const t0=performance.now(),dur=1800;
        (function frame(now){
          const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
          el.textContent=(target*e).toFixed(dec);
          if(p<1)requestAnimationFrame(frame);else el.textContent=target.toFixed(dec);
        })(t0);
      });
    },{threshold:0.5}).observe(sb);
  }
}

function sendMsg(e){
  e.preventDefault();
  const btn=e.target.querySelector('button');
  const orig=btn.innerHTML;
  btn.innerHTML='<i class="fas fa-check"></i> Message Sent!';
  btn.style.background='linear-gradient(135deg,#22c55e,#16a34a)';
  setTimeout(()=>{btn.innerHTML=orig;btn.style.background='';e.target.reset();},3000);
}

      .from('portfolios')
      .select('data')
      .eq('slug',slug)
      .single();
    if(error||!data){
      main.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted)">
        <i class="fas fa-user-slash" style="font-size:3rem;color:var(--dim)"></i>
        <p style="font-size:1.1rem">Portfolio "<strong style="color:var(--text)">${esc(slug)}</strong>" not found.</p>
        <a href="/" style="color:var(--cyan);font-size:.9rem">← Back to home</a>
      </div>`;
      return;
    }
    renderAll(data.data);
  }catch(e){
    main.innerHTML=`<p style="text-align:center;padding:6rem;color:var(--muted)">Failed to load: ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
