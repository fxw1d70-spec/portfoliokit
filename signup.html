<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account — PortfolioKit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>
:root{--bg:#04080f;--bg1:#080f1c;--cyan:#00d4ff;--orange:#ff6b35;--green:#22c55e;--red:#ef4444;--text:#e6edf3;--muted:#8b949e;--dim:#3d4450;--border:rgba(0,212,255,.12);--g1:linear-gradient(135deg,#00d4ff,#0088bb);--r:12px;--ease:all .25s ease}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1.5rem;position:relative;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,.09),transparent 70%);top:-100px;left:-100px}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(255,107,53,.08),transparent 70%);bottom:-80px;right:-50px}
.card{background:rgba(8,15,28,.95);border:1px solid var(--border);border-radius:20px;padding:2.6rem;width:100%;max-width:460px;position:relative;z-index:1;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.logo{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:800;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.8rem;display:block}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:1.65rem;font-weight:800;letter-spacing:-.5px;margin-bottom:.4rem}
.card-sub{font-size:.875rem;color:var(--muted);margin-bottom:2rem;line-height:1.6}
.fg{margin-bottom:1.25rem}
.fg label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px}
.inp-wrap{position:relative}
.inp-wrap i.ico{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.82rem;pointer-events:none}
.inp-wrap input{width:100%;padding:.78rem 1rem .78rem 2.5rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:var(--ease)}
.inp-wrap input:focus{border-color:var(--cyan);background:rgba(0,212,255,.025);box-shadow:0 0 0 3px rgba(0,212,255,.08)}
.inp-wrap input::placeholder{color:var(--dim)}
.inp-wrap input.valid{border-color:var(--green)}
.inp-wrap input.invalid{border-color:var(--red)}
.inp-wrap .toggle-pw{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:var(--dim);cursor:pointer;font-size:.82rem;transition:var(--ease)}.inp-wrap .toggle-pw:hover{color:var(--cyan)}
.slug-status{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-size:.82rem}
.hint{font-size:.73rem;color:var(--dim);margin-top:.38rem;display:flex;align-items:center;gap:.35rem;min-height:1.2rem}
.hint.ok{color:var(--green)}.hint.err{color:var(--red)}.hint.checking{color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-submit{width:100%;padding:.9rem;background:var(--g1);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;transition:var(--ease);display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.3rem}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,212,255,.35)}
.btn-submit:disabled{opacity:.6;pointer-events:none}
.err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:.75rem 1rem;font-size:.84rem;color:var(--red);margin-bottom:1.2rem;display:none}
.err-box.show{display:block}
.footer-text{text-align:center;margin-top:1.5rem;font-size:.84rem;color:var(--muted)}
.footer-text a{color:var(--cyan);font-weight:600;transition:var(--ease)}.footer-text a:hover{text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--dim);margin-bottom:1.5rem;transition:var(--ease)}.back-link:hover{color:var(--cyan)}
.public-url{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.15);border-radius:8px;padding:.6rem .9rem;font-size:.8rem;color:var(--muted);margin-top:.5rem;font-family:'JetBrains Mono',monospace}
.public-url span{color:var(--cyan)}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to home</a>
  <span class="logo">PortfolioKit</span>
  <div class="card-title">Create your portfolio</div>
  <div class="card-sub">Takes under 2 minutes. Your public link is set here and can't be changed later.</div>

  <div class="err-box" id="err-box"><i class="fas fa-circle-xmark"></i> <span id="err-msg"></span></div>

  <form id="signup-form">
    <div class="row2">
      <div class="fg">
        <label>First Name</label>
        <div class="inp-wrap">
          <i class="fas fa-user ico"></i>
          <input type="text" id="fname" placeholder="Arjun" required>
        </div>
      </div>
      <div class="fg">
        <label>Last Name</label>
        <div class="inp-wrap">
          <i class="fas fa-user ico"></i>
          <input type="text" id="lname" placeholder="Mehta" required>
        </div>
      </div>
    </div>

    <div class="fg">
      <label>Email</label>
      <div class="inp-wrap">
        <i class="fas fa-envelope ico"></i>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
    </div>

    <div class="fg">
      <label>Password</label>
      <div class="inp-wrap">
        <i class="fas fa-lock ico"></i>
        <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
        <span class="toggle-pw" onclick="togglePw()"><i class="fas fa-eye" id="pw-eye"></i></span>
      </div>
    </div>

    <div class="fg">
      <label>Your Portfolio Slug <span style="color:var(--red)">*</span></label>
      <div class="inp-wrap">
        <i class="fas fa-at ico"></i>
        <input type="text" id="slug" placeholder="arjun-mehta" required maxlength="58"
          oninput="onSlugInput()" autocomplete="off" spellcheck="false">
        <span class="slug-status" id="slug-status"></span>
      </div>
      <div class="hint" id="slug-hint">Only lowercase letters, numbers, and hyphens.</div>
      <div class="public-url" id="public-url" style="display:none">
        Your public link: <span id="url-preview">…</span>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">
      <i class="fas fa-rocket"></i> Create My Portfolio
    </button>
  </form>

  <p class="footer-text">Already have an account? <a href="/login.html">Sign in</a></p>
</div>

<script>
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Redirect if already logged in
supa.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = '/admin';
});

function togglePw() {
  const inp = document.getElementById('password');
  const ico = document.getElementById('pw-eye');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  ico.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
}

function showErr(msg) {
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err-box').classList.add('show');
}

/* ── Slug validation & availability check ──────────────── */
let slugCheckTimer = null;
let slugValid = false;

function onSlugInput() {
  const raw = document.getElementById('slug').value;
  const clean = raw.toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (raw !== clean) document.getElementById('slug').value = clean;

  const hint   = document.getElementById('slug-hint');
  const status = document.getElementById('slug-status');
  const urlBox = document.getElementById('public-url');
  const urlPrev= document.getElementById('url-preview');
  const inp    = document.getElementById('slug');

  slugValid = false;
  clearTimeout(slugCheckTimer);

  if (!clean) {
    hint.textContent = 'Only lowercase letters, numbers, and hyphens.';
    hint.className = 'hint';
    status.textContent = '';
    inp.className = '';
    urlBox.style.display = 'none';
    return;
  }

  if (clean.length < 3) {
    hint.textContent = 'Slug must be at least 3 characters.';
    hint.className = 'hint err';
    status.innerHTML = '<i class="fas fa-xmark" style="color:var(--red)"></i>';
    inp.className = 'invalid';
    urlBox.style.display = 'none';
    return;
  }

  // Show preview
  const origin = window.location.origin;
  urlPrev.textContent = `${origin}/portfolio/${clean}`;
  urlBox.style.display = 'block';

  hint.textContent = 'Checking availability…';
  hint.className = 'hint checking';
  status.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="color:var(--cyan)"></i>';
  inp.className = '';

  slugCheckTimer = setTimeout(() => checkSlug(clean), 500);
}

async function checkSlug(slug) {
  const hint   = document.getElementById('slug-hint');
  const status = document.getElementById('slug-status');
  const inp    = document.getElementById('slug');

  const { data } = await supa
    .from('portfolios')
    .select('slug')
    .eq('slug', slug)
    .maybeSingle();

  if (data) {
    hint.textContent = `"${slug}" is already taken. Try another.`;
    hint.className = 'hint err';
    status.innerHTML = '<i class="fas fa-xmark" style="color:var(--red)"></i>';
    inp.className = 'invalid';
    slugValid = false;
  } else {
    hint.textContent = `"${slug}" is available!`;
    hint.className = 'hint ok';
    status.innerHTML = '<i class="fas fa-check" style="color:var(--green)"></i>';
    inp.className = 'valid';
    slugValid = true;
  }
}

/* ── Default portfolio data for new users ──────────────── */
function defaultData(slug, name) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return {
    meta: { slug },
    profile: {
      name, initials,
      photo: `https://randomuser.me/api/portraits/men/1.jpg`,
      availability: 'Open to Opportunities', availability_dot: true,
      roles: ['Engineering Student', 'Problem Solver', 'Researcher'],
      headline: 'Engineering Student',
      tagline: 'A passionate engineering student ready to make an impact.',
      chips: [
        { icon: 'fas fa-cog',  color: 'cyan',   label: 'Specialty', value: 'Engineering' },
        { icon: 'fas fa-star', color: 'orange', label: 'Status',    value: 'Available'   },
      ],
      about: {
        title: 'About Me, ', highlight: 'Passionate Engineer',
        paragraphs: [
          'Write your introduction here. Tell recruiters and collaborators who you are.',
          'Share what drives you — your engineering philosophy, research interests, or career goals.',
          'Mention what you\'re looking for: internships, research, collaborations, or full-time roles.',
        ],
        details: {
          degree: 'B.Tech', university: 'Your University', graduation: '2026',
          location: 'City, Country', specialization: 'Your Specialisation',
          status: 'Open to Opportunities', cgpa: '0.0',
        },
      },
    },
    contact: {
      email: '', phone: '',
      linkedin: 'linkedin.com/in/you', linkedin_url: '#',
      github: 'github.com/you', github_url: '#', cv_url: '#',
    },
    stats: [
      { value: 0, decimals: 1, label: 'CGPA'          },
      { value: 0, decimals: 0, label: 'Projects'       },
      { value: 0, decimals: 0, label: 'Certifications' },
      { value: 0, decimals: 0, label: 'Awards'         },
    ],
    skills: { core: [], computational: [], tools: [] },
    projects: [], education: [], certifications: [],
    honours: [], publications: [], patents: [],
    volunteer: [], services: [],
    career_break: {
      enabled: false, title: '', period: '', duration: '',
      location: '', paragraphs: [], bullets: [], outcomes: [],
    },
  };
}

/* ── Signup ─────────────────────────────────────────────── */
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('err-box').classList.remove('show');

  const fname    = document.getElementById('fname').value.trim();
  const lname    = document.getElementById('lname').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const slug     = document.getElementById('slug').value.trim();
  const fullName = `${fname} ${lname}`.trim();

  if (!slugValid) {
    showErr('Please choose a valid, available slug before continuing.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating account…';

  // Create auth user — slug passed in metadata so the DB trigger can use it
  const { data: authData, error: authErr } = await supa.auth.signUp({
    email, password,
    options: { data: { full_name: fullName, slug } }
  });

  if (authErr) {
    showErr(authErr.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-rocket"></i> Create My Portfolio';
    return;
  }

  // Supabase DB trigger (handle_new_user) creates the portfolio row automatically.
  // If a session was returned the user is logged in; if not, email confirmation is on.
  if (authData.session) {
    btn.innerHTML = '<i class="fas fa-check"></i> All set! Redirecting…';
    setTimeout(() => window.location.href = '/admin/edit', 800);
  } else {
    // Email confirmation is enabled in Supabase — ask user to confirm then sign in
    btn.innerHTML = '<i class="fas fa-envelope"></i> Check your email to confirm';
    showErr('Almost there! Check your inbox and click the confirmation link, then sign in.');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
